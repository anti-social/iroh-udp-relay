[package]
name = "iroh-udp-relay"
version = "0.2.0"
edition = "2021"
description = "UDP relay for iroh endpoints that cannot connect directly"

[[bin]]
name = "iroh-udp-relay"
required-features = ["server"]

[features]
client = [
    "dep:iroh",
    "dep:log",
    "dep:n0-watcher",
    "dep:noq-udp",
    "dep:tokio",
    "dep:tokio-util",
]
server = [
    "dep:argh",
    "dep:env_logger",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:iroh-metrics",
    "dep:log",
    "dep:snafu",
    "dep:tokio",
]

[dependencies]
iroh-base = { version = "1.4.0", default-features = false, features = ["key"] }
rand = "0.9.2"

# The custom transport API is unstable, it can break in any iroh release
iroh = { version = "=1.4.1", default-features = false, features = ["unstable-custom-transports"], optional = true }
# The same versions as iroh uses, they are a part of the custom transport API
n0-watcher = { version = "1.0.1", optional = true }
noq-udp = { version = "1.4.0", default-features = false, optional = true }
tokio-util = { version = "0.7.18", optional = true }

argh = { version = "0.1.13", optional = true }
env_logger = { version = "0.11.5", optional = true }
http-body-util = { version = "0.1.3", optional = true }
hyper = { version = "1.8.1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1.19", features = ["tokio"], optional = true }
iroh-metrics = { version = "1.0.2", default-features = false, features = ["metrics", "service"], optional = true }
log = { version = "0.4.21", optional = true }
snafu = { version = "0.9.0", optional = true }
tokio = { version = "1.41.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"], optional = true }

[dev-dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
tokio = { version = "1.41.1", features = ["io-util"] }

[[test]]
name = "client"
required-features = ["client", "server"]
